spring:
  application:
    name: graphify-backend
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    url: jdbc:postgresql://localhost:5432/graphify
    username: ${DB_USER:anchors}
    password: ${DB_PASSWORD:Dodzjtm26!@pg}
    driver-class-name: org.postgresql.Driver
  redis:
    host: localhost
    password: Dodzjtm26!@redis
    port: 6379
    timeout: 2000
  cache:
    type: redis
    redis:
      time-to-live: 3600000

server:
  port: 8086
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

jwt:
  secret: ${JWT_SECRET:zZAR3iS9NAnzj56wrQKqqMFqD1OZWQOoRx0kuee7p9k}
  expiration: ${JWT_EXPIRATION:3600000}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://172.30.0.22:8080}
  model: ${OLLAMA_MODEL:gemma3:27b}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

neo4j:
  uri: ${NEO4J_URI:bolt://localhost:7687}
  authentication:
    username: ${NEO4J_USER:neo4j}
    password: ${NEO4J_PASSWORD:neo4j}

logging:
  level:
    root: INFO
    com.graphify: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

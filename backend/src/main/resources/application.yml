spring:
  application:
    name: graphify-backend
    version: 0.1.0

  datasource:
    url: jdbc:postgresql://localhost:5432/graphify
    username: anchors
    password: ${DB_PASSWORD:Dodzjtm26!@pg}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
    open-in-view: false

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:Dodzjtm26!@redis}
    database: 3
    timeout: 2000ms
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  security:
    jwt:
      secret: ${JWT_SECRET:your-secret-key-min-32-characters-long!}
      expiration: 3600000  # 1 hour in milliseconds

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:neo4j}

server:
  port: 8086
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.graphify: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always

graphify:
  storage:
    root: ${GRAPHIFY_STORAGE_ROOT:./storage}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://172.30.0.29:8080}
    model: ${OLLAMA_MODEL:gemma3:27b}
    timeout-seconds: 60
  chat:
    max-context-chars: 100000
    max-documents-per-answer: 20
    history-turns: 5
